name: Attach ChatGPT skills to release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  package-chatgpt-skills:
    runs-on: ubuntu-latest

    steps:
      - name: Check out released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Package ChatGPT skills
        run: python3 scripts/package_chatgpt_skills.py

      - name: Prepare release assets
        run: |
          cp dist/chatgpt/fluent-korean/skill.zip fluent-korean-chatgpt.zip
          cp dist/chatgpt/fluent-korean-not-coding/skill.zip fluent-korean-not-coding-chatgpt.zip

      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            fluent-korean-chatgpt.zip \
            fluent-korean-not-coding-chatgpt.zip \
            --clobber
